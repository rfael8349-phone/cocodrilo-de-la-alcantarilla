<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101914"><title>El Cocodrilo — prueba 2.5D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101914;color:#eff5d7;font-family:system-ui,sans-serif;touch-action:none}#game{width:100%;height:100%;display:block;image-rendering:pixelated}#hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}#top{display:flex;align-items:center;gap:10px;text-shadow:2px 2px #000;font-weight:800;font-size:13px}#health{width:112px;height:12px;border:2px solid #e7edc5;background:#342d27}#fill{height:100%;width:100%;background:#b9d957}#hint{margin-left:auto;text-align:right}#stick{position:absolute;left:18px;bottom:24px;width:124px;height:124px;border:3px solid #e7edc577;border-radius:50%;background:#14251dbb;pointer-events:auto;display:grid;place-items:center}#nub{width:48px;height:48px;border-radius:50%;background:#dce8b8bb;border:2px solid #fff}#attacks{position:absolute;right:14px;bottom:22px;display:grid;grid-template-columns:repeat(2,70px);gap:7px;pointer-events:auto}button{border:2px solid #dce8b8;background:#243a2b;color:#fff;font-weight:900;border-radius:12px;padding:10px 4px;min-height:48px;box-shadow:0 3px #0a100c;font-size:11px}button:active{transform:translateY(2px);box-shadow:0 1px #0a100c}#toast{position:absolute;top:19%;left:10%;width:80%;text-align:center;font-size:20px;font-weight:1000;color:#f3d86a;text-shadow:3px 3px #172017;opacity:0;transition:opacity .15s}#start{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:16px;padding:15px 24px}#help{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);font-size:9px;color:#d6dfbf99;white-space:nowrap}@media(min-width:700px){#stick{width:140px;height:140px}#attacks{grid-template-columns:repeat(2,82px)}button{font-size:12px}}
</style></head><body>
<canvas id="game"></canvas><div id="hud"><div id="top"><div id="health"><div id="fill"></div></div><span id="stats">RATAS: 0 / 8</span><span id="hint">PRUEBA 2.5D · ALCANTARILLA</span></div><div id="toast"></div><div id="stick"><div id="nub"></div></div><div id="attacks"><button data-a="bite">MORDISCO</button><button data-a="tail">COLAZO</button><button data-a="stomp">PISOTÓN</button><button data-a="roll">GIRO</button></div><button id="start">EMPEZAR</button><div id="help">Joystick: caminar y esquivar · toca los ataques para combatir</div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=480,H=320,fill=document.getElementById('fill'),stats=document.getElementById('stats'),toast=document.getElementById('toast'),startBtn=document.getElementById('start'),stick=document.getElementById('stick'),nub=document.getElementById('nub');
let dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(innerWidth*dpr);canvas.height=Math.floor(innerHeight*dpr);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px'}addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let player={x:0,z:0,hp:100,face:1,walk:0,attack:'',at:0,inv:0},rats=[],kills=0,playing=false,elapsed=0,toastTime=0,joy={x:0,y:0},keys={},shake=0;
function message(s){toast.textContent=s;toast.style.opacity=1;toastTime=1.25}
function spawn(){rats=[];for(let i=0;i<8;i++)rats.push({x:rand(-8,8),z:rand(-5,9),hp:2,phase:rand(0,6),cool:rand(.3,1.5),leap:0,hit:0})}
function attack(type){if(!playing||player.at>0)return;player.attack=type;player.at=type==='roll'?.62:.38;player.inv=.25;let hit=0;
for(const r of rats){const dx=r.x-player.x,dz=r.z-player.z,dist=Math.hypot(dx,dz);let ok=false;
if(type==='bite')ok=dist<2.5&&dx*player.face>-.25;
if(type==='tail')ok=dist<2.8&&dx*player.face<.6;
if(type==='stomp')ok=dist<2.1;
if(type==='roll')ok=dist<3.5;
if(ok){r.hp-=type==='roll'?2:1;r.hit=.24;hit++;if(r.hp<=0){r.dead=true;kills++}}}
rats=rats.filter(r=>!r.dead);if(hit){message(type==='bite'?'¡ÑAC!':type==='tail'?'¡COLAZO!':type==='stomp'?'¡PISOTÓN!':'¡GIRO DE LA MUERTE!');shake=.16}else message('¡A por ellas!');stats.textContent='RATAS: '+kills+' / 8';if(kills>=8){message('¡ALCANTARILLA DESPEJADA!');playing=false;startBtn.textContent='VOLVER A JUGAR';startBtn.hidden=false}}
function start(){player={x:0,z:0,hp:100,face:1,walk:0,attack:'',at:0,inv:0};kills=0;elapsed=0;spawn();playing=true;startBtn.hidden=true;message('¡CUIDADO! ¡VIENEN LAS RATAS!');stats.textContent='RATAS: 0 / 8'}
startBtn.addEventListener('click',start);
document.querySelectorAll('[data-a]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();attack(b.dataset.a)})});
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')attack('bite');if(e.code==='KeyJ')attack('tail');if(e.code==='KeyK')attack('stomp');if(e.code==='KeyL')attack('roll')});addEventListener('keyup',e=>keys[e.code]=false);
let pointer=null;function setJoy(e){const r=stick.getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)/(r.width/2),dy=(e.clientY-r.top-r.height/2)/(r.height/2),m=Math.hypot(dx,dy)||1;joy.x=dx/Math.max(1,m);joy.y=dy/Math.max(1,m);nub.style.transform='translate('+joy.x*31+'px,'+joy.y*31+'px)'}
stick.addEventListener('pointerdown',e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);setJoy(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===pointer)setJoy(e)});function release(e){if(e.pointerId===pointer){pointer=null;joy.x=joy.y=0;nub.style.transform=''}}stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);
function update(dt){if(toastTime>0){toastTime-=dt;if(toastTime<=0)toast.style.opacity=0}if(!playing)return;elapsed+=dt;player.at=Math.max(0,player.at-dt);player.inv=Math.max(0,player.inv-dt);let dx=joy.x+((keys.ArrowRight||keys.KeyD)?1:0)-((keys.ArrowLeft||keys.KeyA)?1:0),dz=joy.y+((keys.ArrowDown||keys.KeyS)?1:0)-((keys.ArrowUp||keys.KeyW)?1:0);let mag=Math.hypot(dx,dz);if(mag>1){dx/=mag;dz/=mag}player.x=clamp(player.x+dx*5.5*dt,-9,9);player.z=clamp(player.z+dz*5.5*dt,-6,10);if(Math.abs(dx)>.08)player.face=Math.sign(dx);player.walk+=mag*dt*11;
for(const r of rats){r.phase+=dt*9;r.cool-=dt;r.hit=Math.max(0,r.hit-dt);const rx=player.x-r.x,rz=player.z-r.z,dist=Math.hypot(rx,rz)||1;if(dist<8){if(dist>1.25){r.x+=rx/dist*2.0*dt;r.z+=rz/dist*2.0*dt;if(r.cool<0&&dist<4){r.leap=.35;r.cool=rand(1.1,2)}}else if(r.cool<0&&player.inv<=0){player.hp-=7;r.cool=.9;player.inv=.3;message('¡TE ARAÑÓ UNA RATA!')}}if(r.leap>0)r.leap-=dt}
player.hp=clamp(player.hp,0,100);fill.style.width=player.hp+'%';if(player.hp<=0){playing=false;startBtn.hidden=false;startBtn.textContent='REINTENTAR';message('¡TE HAN VENCIDO LAS RATAS!')}}
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fill()}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function line(x,y,x2,y2,c,w=1){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke()}
function drawBackground(){rect(0,0,W,H,'#111b19');let grad=ctx.createLinearGradient(0,0,0,190);grad.addColorStop(0,'#202e29');grad.addColorStop(1,'#3b4940');ctx.fillStyle=grad;ctx.fillRect(0,0,W,190);
// rounded sewer arch silhouette
ctx.fillStyle='#647064';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,118);ctx.quadraticCurveTo(240,-55,480,118);ctx.lineTo(480,0);ctx.closePath();ctx.fill();
ctx.strokeStyle='#929a80';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(0,116);ctx.quadraticCurveTo(240,-52,480,116);ctx.stroke();
for(let i=0;i<9;i++){let x=i*62-15;rect(x,45+(i%3)*8,24,5,'#84907a');rect(x+5,52+(i%3)*8,3,2,'#bac19a')}
rect(0,176,W,144,'#344139');poly([[0,188],[480,188],[480,320],[0,320]],'#36463b');
for(let z=0;z<7;z++){let y=195+z*20;line(0,y,480,y+rand(-2,2),'#53614c',1);for(let x=0;x<480;x+=38){rect(x+((z%2)*17),y+4,2,2,'#829071')}}
// flowing water central ribbon
poly([[0,222],[95,205],[190,220],[290,202],[390,218],[480,207],[480,285],[390,294],[285,277],[180,296],[90,280],[0,291]],'#245a60');
for(let i=0;i<24;i++){let x=(i*53+elapsed*35)%500,y=225+(i*17)%62;line(x,y,x+rand(8,22),y-2,'#75b8a0',1)}
// pipes and grate details
rect(0,155,480,9,'#202b27');rect(0,160,480,3,'#7b8371');for(let x=18;x<480;x+=62){rect(x,145,5,26,'#6d7567');rect(x+6,147,2,23,'#202820')}
}
function drawCroc(x,y,scale){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);let bob=Math.sin(player.walk)*1.3,attack=player.at>0?player.at:0;
if(player.attack==='roll'&&attack>0)ctx.rotate(Math.sin(elapsed*35)*.25);
rect(-29,14,58,7,'#17251c'); // shadow
// tail articulated segments
let tailSwing=Math.sin(elapsed*7)*4+(player.attack==='tail'&&attack>0?Math.sin(attack*35)*13:0);
poly([[-25,0],[-43+tailSwing,-7],[-61+tailSwing,-3],[-68+tailSwing,4],[-49+tailSwing,5],[-27,8]],'#387c37');line(-43+tailSwing,-3,-60+tailSwing,1,'#82b64a',2);
poly([[-28,-8],[19,-9],[30,0],[18,12],[-24,10],[-34,1]],'#3d8c3e');poly([[-24,5],[18,5],[25,10],[14,14],[-23,12]],'#b9c978');
for(let i=0;i<9;i++){let sx=-20+i*5;poly([[sx,-8],[sx+3,-13],[sx+6,-8]],'#245b2c')}
for(let i=0;i<5;i++){let sx=-18+i*8;rect(sx,-3,3,2,'#80b94b');rect(sx,7,4,2,'#7eaa4a')}
let legSwing=Math.sin(player.walk)*4;for(let s of[-1,1]){poly([[s*15,5],[s*23,7+legSwing],[s*28,13+legSwing],[s*17,12],[s*12,9]],'#316e32');for(let k=0;k<3;k++)rect(s*25+(k-1)*3,12+legSwing,2,2,'#c3ce83')}
// neck and head
poly([[12,-5],[28,-10],[40,-9],[44,-3],[32,2],[17,4]],'#4a9b43');poly([[23,-11],[42,-16],[60,-12],[69,-7],[66,0],[47,1],[32,-2]],'#4a9b43');
poly([[31,-2],[66,-5],[70,0],[61,4],[36,3]],'#c6d18a');
for(let i=0;i<7;i++){let sx=37+i*4;rect(sx,-11+(i%2),2,2,'#83c45a')}
rect(47,-16,4,3,'#e8d85a');rect(49,-16,2,2,'#141b12');rect(61,-10,3,2,'#18231a'); // nostril
// teeth
for(let i=0;i<5;i++)poly([[43+i*4,-3],[45+i*4,-3],[44+i*4,0]],'#fff1c4');
// expressive confident brow
line(44,-18,51,-19,'#204c27',2);
// visible five-finger front hand
poly([[18,2],[24,3],[26,8],[23,10],[21,7],[20,12],[17,12],[17,8],[14,11],[12,9],[15,5],[12,7],[11,5],[16,2]],'#4a9b43');rect(17,10,2,2,'#c6d18a');
ctx.restore()}
function drawRat(r){let x=240+(r.x-player.x)*16,y=190+(r.z-player.z)*9;let bob=Math.sin(r.phase)*2+(r.leap>0?-r.leap*17:0);ctx.save();ctx.translate(x,y-bob);if(r.hit>0)ctx.globalAlpha=.5;rect(-10,5,21,4,'#151713');poly([[-10,-1],[-7,-7],[4,-8],[11,-3],[8,3],[-6,3]],'#514a45');poly([[2,-6],[7,-12],[12,-10],[12,-5]],'#6c6058');rect(7,-11,4,4,'#bd7770');rect(8,-7,2,2,'#f4d1a1');rect(10,-7,2,2,'#d84d3d');line(-9,0,-19,6,'#b77b73',2);for(let i=0;i<3;i++)line(-5+i*6,2,-7+i*6,7,'#b6a18d',1);ctx.restore()}
function render(){ctx.save();ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);ctx.imageSmoothingEnabled=false;drawBackground();
// distant rat silhouettes crossing tunnel
for(let i=0;i<3;i++){let xx=((i*177+elapsed*27)%540)-30,yy=88+(i%2)*22;rect(xx,yy,12,5,'#17211c');rect(xx+8,yy-4,7,5,'#17211c');line(xx,yy+4,xx-8,yy+8,'#17211c',2)}
let sorted=[...rats].sort((a,b)=>a.z-b.z);for(const r of sorted)drawRat(r);
let px=240,py=190;let sx=1+player.z*.012,sy=1+player.z*.008;ctx.save();ctx.translate(px,py+player.z*2);ctx.scale(sx,sy);if(player.inv>0&&Math.floor(elapsed*20)%2===0)ctx.globalAlpha=.55;drawCroc(0,0,1);ctx.restore();
// foreground reeds and debris
for(let i=0;i<8;i++){let x=i*67+((i%2)*11);line(x,292,x-5,270,'#55783f',3);line(x,292,x+6,274,'#6a8d4a',2)}
// vignette
let vg=ctx.createRadialGradient(240,150,80,240,150,270);vg.addColorStop(0,'#0000');vg.addColorStop(1,'#07100c99');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
if(shake>0){shake-=.016;ctx.translate(rand(-2,2),rand(-2,2))}ctx.restore()}
let last=performance.now();function loop(now){let dt=Math.min(.04,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
